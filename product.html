<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product details – Shamba Market</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="hdr"></div>
  <main>
    <div id="steps"></div>
    <div id="view"></div>
  </main>

  <script src="app.js"></script>
  <script>
    // Check if this is the product details page for buyers
    if (page("products", "buyer", "product")) {
      const p = get(param("id"));

      // If product not found
      if (!p) {
        $("#view").innerHTML = `
          <div class="card empty">
            <h2>Product not found</h2>
            <a class="btn" href="products.html">Back to products</a>
          </div>
        `;
      } else {
        const inC = S.cart[p.id] || 0;

        // Render product details
        $("#view").innerHTML = `
          <a class="btn alt" href="products.html">Back to products</a>
          <div class="card row" style="margin-top:1rem">
            <div class="big" style="flex:0 1 280px">
              ${pic(p)}
            </div>
            <div>
              <h1>${p.n}</h1>
              <p class="price" style="font-size:1.4rem">${fmt(p.p)} / ${p.u}</p>
              <p>${p.d}</p>
              <p class="mute">
                Sold by ${p.f} · Category: ${p.c} · ${p.s} ${p.u} in stock
                ${inC ? ` · ${inC} in your cart` : ""}
              </p>

              <label for="dq">Quantity</label>
              <input id="dq" type="number" min="1" max="${p.s}" value="1" style="max-width:120px">

              <div style="display:flex;gap:.6rem;margin-top:1rem;flex-wrap:wrap">
                <button class="btn" id="add">Add to cart</button>
                <a class="btn alt" href="cart.html">Go to cart</a>
              </div>
            </div>
          </div>
        `;

        // Add to cart handler
        $("#add").onclick = () => {
          const qty = Math.max(1, parseInt($("#dq").value) || 1);
          add(p.id, qty);
        };
      }
    }
  </script>
</body>
</html>
